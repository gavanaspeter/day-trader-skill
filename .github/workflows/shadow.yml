name: Shadow day
on:
  schedule:
    - cron: "30 22 * * 1-5"   # 8:30-9:30 AM Sydney, after the US close
  workflow_dispatch:           # lets you press "Run workflow" to test
permissions:
  contents: write
jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Write the rules (paper, no keys)
        run: |
          mkdir -p trader
          cat > trader/config.json <<'EOF'
          {
            "budget": 1000,
            "cash_buffer_pct": 10,
            "max_position_pct": 75,
            "max_order_usd": 900,
            "min_order_usd": 5,
            "max_loss_per_trade_usd": 50,
            "max_daily_loss_usd": 150,
            "max_trades_per_day": 3,
            "max_orders_per_day": 10,
            "min_reward_risk": 1.0,
            "require_stop": true,
            "no_entries_before": "09:45",
            "no_entries_after": "15:30",
            "flat_by": "15:55",
            "fractional": false,
            "broker": "alpaca",
            "paper": true,
            "blocked": [],
            "allow_options": false,
            "allow_margin": false,
            "allow_short": false,
            "pdt_guard": false,
            "sec_user_agent": ""
          }
          EOF
      - name: Run the shadow day (no orders, no broker)
        run: python trader/nightly.py
      - name: Save the log
        run: |
          git config user.name "shadow-bot"
          git config user.email "shadow-bot@users.noreply.github.com"
          git add trader/shadow-log.md
          git commit -m "shadow log" || echo "nothing to commit"
          git push
